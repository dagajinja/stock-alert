name: backfill

on:
  workflow_dispatch:
    inputs:
      days:
        description: "몇 영업일치를 채울지 (기본 120 = 약 6개월)"
        required: false
        default: "120"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: 과거 데이터 수집
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          BACKFILL_DAYS: ${{ github.event.inputs.days }}
        run: python backfill.py

      - name: 결과 저장(커밋)
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "backfill $(date -u +%Y-%m-%d)"
            git push
          fi
