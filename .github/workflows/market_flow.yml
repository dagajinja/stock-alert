name: market-flow

on:
  schedule:
    # UTC 기준. 22:00 UTC = 한국시간 다음날 07:00 (전날 확정 데이터 수집)
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
    inputs:
      bas_dd:
        description: "기준일 (YYYYMMDD). 비워두면 오늘"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: market-flow
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        run: pip install requests

      - name: 수집 및 발송
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BAS_DD: ${{ github.event.inputs.bas_dd }}
        run: python market_flow.py

      - name: 결과 저장(커밋)
        if: always()
        run: |
          if [ ! -d data ]; then
            echo "data 폴더 없음 (휴장일 등) - 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "market flow $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
